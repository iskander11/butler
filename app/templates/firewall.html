{% extends 'base.html' %}
{% block title %}Firewall — Дворецкий{% endblock %}
{% block content %}
<section class="panel">
    <h2>Сгенерированные правила</h2>
    {% if skipped %}
    <div class="flash flash-error">Некорректные адреса: {{ skipped | join(', ') }}</div>
    {% endif %}
    <div class="firewall-actions">
        <form method="post" action="{{ url_for('main.export_firewall') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Сохранить в файл</button>
        </form>
        <form method="post" action="{{ url_for('main.firewall_apply') }}"
              onsubmit="return confirm('Применить правила через UFW прямо сейчас?')">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="confirm_apply" value="yes">
            <button type="submit" class="button-warning">Применить правила</button>
        </form>
    </div>
    <pre class="code-block">{{ rules }}</pre>
</section>
{% endblock %}
